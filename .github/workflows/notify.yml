name: Maple Sunday notification
on:
  schedule:
    - cron: '7,17,27,37,47,57 9-18 * * 5'
      timezone: 'Asia/Seoul'
    - cron: '13 21 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: maple-sunday-notifier
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: mvn -B --no-transfer-progress verify
      - name: Poll once
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: java -jar target/maple-sunday-notifier-1.2.0.jar
      - name: Commit state if changed
        run: |
          if git diff --quiet -- state.json; then
            echo "No changes in state.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update Sunday notice cursor [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep $((attempt * 2))
            # If a user changed other tracked files, don't perform an automatic rebase.
          done
          echo "Unable to push state; next run may duplicate webhook" >&2
          exit 1
